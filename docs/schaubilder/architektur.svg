<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1200" viewBox="0 0 680 600" font-family="'Segoe UI', Arial, sans-serif">
<title>Workflow des Change-Request-Agenten nach Systemen abgegrenzt</title>
<style>
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.8;stroke-dasharray:3 3;fill:none}
.zone{fill:none;stroke:#888780;stroke-width:0.8;stroke-dasharray:5 4}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.8}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.8}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="600" fill="#FFFFFF"/>

<rect class="zone" x="30" y="18" width="466" height="76"/>
<rect class="zone" x="30" y="94" width="466" height="152"/>
<rect class="zone" x="30" y="246" width="466" height="76"/>
<rect class="zone" x="30" y="322" width="466" height="76"/>
<rect class="zone" x="30" y="398" width="620" height="182"/>
<rect class="zone" x="506" y="94" width="144" height="300"/>

<text class="th" x="48" y="48">Ticketsystem</text>
<text class="ts" x="48" y="66">oder Mail</text>
<text class="th" x="48" y="162">n8n-Instanz</text>
<text class="ts" x="48" y="180">Hosting offen</text>
<text class="th" x="48" y="276">Cloud-LLM-API</text>
<text class="ts" x="48" y="294">nur Geschwärztes</text>
<text class="th" x="48" y="354">n8n-Instanz</text>
<text class="ts" x="48" y="372">Hosting offen</text>
<text class="th" x="48" y="426">Slack oder Mail</text>
<text class="ts" x="48" y="444">Freigabe und</text>
<text class="ts" x="48" y="460">Weiterleitung</text>
<text class="th" x="520" y="112">Datenhaltung</text>
<text class="ts" x="520" y="128">Produkt offen</text>

<line x1="340" y1="82" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="158" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="234" x2="340" y2="256" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="310" x2="340" y2="332" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="386" x2="340" y2="408" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="190" y="30" width="300" height="52" rx="8"/>
<text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Eingang</text>
<text class="ts" x="340" y="67" text-anchor="middle" dominant-baseline="central">Ticket oder weitergeleitete Mail</text>
</g>
<g class="c-teal">
<rect x="190" y="106" width="300" height="52" rx="8"/>
<text class="th" x="340" y="125" text-anchor="middle" dominant-baseline="central">Geschwärzten Vertrag laden</text>
<text class="ts" x="340" y="143" text-anchor="middle" dominant-baseline="central">ID fest, nicht vom Modell</text>
</g>
<g class="c-teal">
<rect x="190" y="182" width="300" height="52" rx="8"/>
<text class="th" x="340" y="201" text-anchor="middle" dominant-baseline="central">Kundenanfrage schwärzen</text>
<text class="ts" x="340" y="219" text-anchor="middle" dominant-baseline="central">Regelbasiert, vor dem Modell</text>
</g>
<g class="c-purple">
<rect x="190" y="258" width="300" height="52" rx="8"/>
<text class="th" x="340" y="277" text-anchor="middle" dominant-baseline="central">Cloud-LLM prüft die Anfrage</text>
<text class="ts" x="340" y="295" text-anchor="middle" dominant-baseline="central">Inklusive oder extra, mit Vertragsstelle</text>
</g>
<g class="c-teal">
<rect x="190" y="334" width="300" height="52" rx="8"/>
<text class="th" x="340" y="353" text-anchor="middle" dominant-baseline="central">Prüfen und rechnen</text>
<text class="ts" x="340" y="371" text-anchor="middle" dominant-baseline="central">Vertragsstelle, Preis, Kontingent</text>
</g>
<g class="c-gray">
<rect x="190" y="410" width="300" height="52" rx="8"/>
<text class="th" x="340" y="429" text-anchor="middle" dominant-baseline="central">Projektleiter gibt frei</text>
<text class="ts" x="340" y="447" text-anchor="middle" dominant-baseline="central">Send and Wait, Slack oder Mail</text>
</g>

<line x1="340" y1="462" x2="340" y2="485" stroke="#5F5E5A" stroke-width="1.5" fill="none"/>
<path d="M340 485 L144 485 L144 506" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="485" x2="340" y2="506" class="arr" marker-end="url(#arrow)"/>
<path d="M340 485 L536 485 L536 506" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="56" y="508" width="176" height="52" rx="8"/>
<text class="th" x="144" y="527" text-anchor="middle" dominant-baseline="central">Entwicklung (Senior)</text>
<text class="ts" x="144" y="545" text-anchor="middle" dominant-baseline="central">Fehler, Umsetzung</text>
</g>
<g class="c-gray">
<rect x="252" y="508" width="176" height="52" rx="8"/>
<text class="th" x="340" y="527" text-anchor="middle" dominant-baseline="central">Vertrieb</text>
<text class="ts" x="340" y="545" text-anchor="middle" dominant-baseline="central">Zusatzgeld</text>
</g>
<g class="c-gray">
<rect x="448" y="508" width="176" height="52" rx="8"/>
<text class="th" x="536" y="527" text-anchor="middle" dominant-baseline="central">Geschäftsführer</text>
<text class="ts" x="536" y="545" text-anchor="middle" dominant-baseline="central">Vertragsfragen</text>
</g>

<line class="leader" x1="490" y1="132" x2="516" y2="166"/>
<line class="leader" x1="490" y1="132" x2="516" y2="230"/>
<line class="leader" x1="490" y1="360" x2="516" y2="360"/>

<g class="c-coral">
<rect x="516" y="140" width="128" height="52" rx="8"/>
<text class="th" x="580" y="159" text-anchor="middle" dominant-baseline="central">Kundentabelle</text>
<text class="ts" x="580" y="177" text-anchor="middle" dominant-baseline="central">Kunde zu Vertrag</text>
</g>
<g class="c-coral">
<rect x="516" y="204" width="128" height="52" rx="8"/>
<text class="th" x="580" y="223" text-anchor="middle" dominant-baseline="central">Vertragsablage</text>
<text class="ts" x="580" y="241" text-anchor="middle" dominant-baseline="central">geschwärzte Kopien</text>
</g>
<g class="c-coral">
<rect x="516" y="334" width="128" height="52" rx="8"/>
<text class="th" x="580" y="353" text-anchor="middle" dominant-baseline="central">Kontingent</text>
<text class="ts" x="580" y="371" text-anchor="middle" dominant-baseline="central">Buchungsliste</text>
</g>
</svg>
