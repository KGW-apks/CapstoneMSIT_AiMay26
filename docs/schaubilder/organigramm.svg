    <rect x="640" y="760" width="240" height="110" rx="16" fill="#0E7C70"/>
    <text x="760" y="802" font-size="24" fill="#DDF1EE">Junior-Entwicklerin</text>
    <text x="760" y="842" font-size="32" font-weight="700" fill="#FFFFFF">Mira Yildiz</text>
