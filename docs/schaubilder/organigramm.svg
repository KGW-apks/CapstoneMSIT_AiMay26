  <text x="988" y="528" font-size="24" font-weight="700" fill="#8A3B08">Vertrieb und Kundenbetreuung</text>
  <rect x="1392" y="300" width="420" height="250" rx="22" fill="#E6E3F6" stroke="#5B4BB7" stroke-width="3"/>
  <text x="1416" y="528" font-size="24" font-weight="700" fill="#4A3C9C">Verwaltung und Marketing</text>

  <!-- Verbindungen -->
  <g stroke="#6B7C93" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1067 240 V275"/>
    <path d="M532 275 H1602"/>
    <path d="M532 275 V380"/>
    <path d="M1174 275 V380"/>
    <path d="M1602 275 V380"/>
    <path d="M532 490 V540"/>
