    <text x="1067" y="212" font-size="32" font-weight="700" fill="#FFFFFF">Markus Hellwig</text>

    <rect x="128" y="380" width="808" height="110" rx="16" fill="#0E7C70"/>
    <text x="532" y="422" font-size="24" fill="#DDF1EE">Projektleiterin</text>
    <text x="532" y="462" font-size="32" font-weight="700" fill="#FFFFFF">Sabine Roth</text>

