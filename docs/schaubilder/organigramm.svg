    <path d="M376 680 V720"/>
    <path d="M248 720 H504"/>
    <path d="M248 720 V760"/>
    <path d="M504 720 V760"/>
    <path d="M760 680 V760"/>
  </g>

  <!-- Personen -->
  <g text-anchor="middle">
