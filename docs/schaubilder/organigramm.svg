  <!-- Aufgaben bei Kundenwünschen -->
  <rect x="964" y="580" width="848" height="365" rx="22" fill="#FBFCFB" stroke="#D5DDDA" stroke-width="2"/>
  <text x="996" y="634" font-size="30" font-weight="700" fill="#0F1B2D">Wer macht was bei einem Kundenwunsch</text>
  <g font-size="26" fill="#2B3C52">
    <text x="996" y="690"><tspan font-weight="700">Projektleiterin:</tspan> nimmt alles an, bereitet vor</text>
    <text x="996" y="740"><tspan font-weight="700">Vertrieb:</tspan> entscheidet bei Zusatzgeld</text>
    <text x="996" y="790"><tspan font-weight="700">Geschäftsführer:</tspan> entscheidet bei Reklamationen mit Vertragsbezug</text>
    <text x="996" y="840"><tspan font-weight="700">Senior-Entwicklung:</tspan> Fehler, Aufwandsschätzung</text>
    <text x="996" y="890"><tspan font-weight="700">Verwaltung:</tspan> rechnet ab, pflegt Vertragsstände</text>
  </g>

  <!-- Fußzeile -->
  <text x="128" y="1028" font-size="22" fill="#5F7087">Fiktives Unternehmen, alle Namen frei erfunden · Entwurf, Stand 2026-10-13</text>
