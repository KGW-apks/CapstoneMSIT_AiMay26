    <rect x="1412" y="380" width="380" height="110" rx="16" fill="#5B4BB7"/>
    <text x="1602" y="422" font-size="24" fill="#E9E6F8">Buchhaltung und Marketing</text>
    <text x="1602" y="462" font-size="32" font-weight="700" fill="#FFFFFF">Claudia Engel</text>

    <rect x="206" y="570" width="340" height="110" rx="16" fill="#0E7C70"/>
    <text x="376" y="612" font-size="24" fill="#DDF1EE">Senior-Entwickler</text>
    <text x="376" y="652" font-size="32" font-weight="700" fill="#FFFFFF">Tobias Nagel</text>

    <rect x="590" y="570" width="340" height="110" rx="16" fill="#0E7C70"/>
    <text x="760" y="612" font-size="24" fill="#DDF1EE">Senior-Entwicklerin</text>
    <text x="760" y="652" font-size="32" font-weight="700" fill="#FFFFFF">Lena Brandt</text>

    <rect x="128" y="760" width="240" height="110" rx="16" fill="#0E7C70"/>
    <text x="248" y="802" font-size="24" fill="#DDF1EE">Junior-Entwickler</text>
    <text x="248" y="842" font-size="32" font-weight="700" fill="#FFFFFF">Kai Petersen</text>

    <rect x="384" y="760" width="240" height="110" rx="16" fill="#0E7C70"/>
    <text x="504" y="802" font-size="24" fill="#DDF1EE">Junior-Entwickler</text>
